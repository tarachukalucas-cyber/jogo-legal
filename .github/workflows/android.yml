name: Build PC and Android (Godot 4.7.2)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Export Godot 4.7.2 builds
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./build
          presets_to_export: Windows Desktop,Linux Desktop,Android
          export_debug: true
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ilha-viva-windows
          path: "build/Windows Desktop/IlhaViva-Windows.exe"
          if-no-files-found: error
      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: ilha-viva-linux
          path: "build/Linux Desktop/IlhaViva-Linux.x86_64"
          if-no-files-found: error
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ilha-viva-android
          path: build/Android/IlhaViva.apk
          if-no-files-found: error
