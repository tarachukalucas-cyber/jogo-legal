name: Build Ilha Viva - PC primeiro e Android depois

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pc:
    name: Exportar PC (Windows e Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exportar Windows e Linux com Godot 4.7.2
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./build
          presets_to_export: Windows Desktop,Linux Desktop
          export_debug: true
      - name: Enviar executável Windows
        uses: actions/upload-artifact@v4
        with:
          name: ilha-viva-windows
          path: build/IlhaViva-Windows.exe
          if-no-files-found: error
      - name: Enviar versão Linux
        uses: actions/upload-artifact@v4
        with:
          name: ilha-viva-linux
          path: build/IlhaViva-Linux.x86_64
          if-no-files-found: error

  android:
    name: Exportar Android depois do PC
    runs-on: ubuntu-latest
    needs: pc
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Exportar APK com Godot 4.7.2
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./build
          presets_to_export: Android
          export_debug: true
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ilha-viva-android
          path: build/IlhaViva.apk
          if-no-files-found: error
